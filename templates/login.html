{% extends "base.html" %}
{% block title %}Log in · PlateConnect{% endblock %}
{% block content %}
<div class="form-card"><h1>Welcome back</h1><p class="muted">Log in to manage your food-sharing activity.</p>
<form method="post" class="stack">
  <label>Email address<input type="email" name="email" required autocomplete="email"></label>
  <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
  <button>Log in</button>
</form><p>New here? <a href="{{ url_for('register') }}">Create an account</a>.</p></div>
{% endblock %}
